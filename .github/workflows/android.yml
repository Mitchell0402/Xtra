# Builds an APK as a workflow artifact only. Releases are published by hand with the Lagoon
# release key (see README); CI has no key, so an automatic "latest" release here would be
# debug-signed and would break in-app updates.
name: Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: 'basic'
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: apk
        path: app/build/outputs/apk/release/*.apk
