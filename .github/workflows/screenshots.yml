# Records new screenshot baselines on Linux and commits them to the branch it runs on.
# Baselines are only ever recorded here so that font rendering matches the CI comparison
# (plan section 10.2). Run it from the Actions tab on the PR branch after an intended UI change.
name: Update screenshot baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: 'basic'
    - name: Record baselines
      run: ./gradlew :app:recordRoborazziDebug
    - name: Commit changed baselines
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/src/testDebug/screenshots
        if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
        git commit -m "Update screenshot baselines"
        git push
